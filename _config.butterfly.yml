# Navigation Settings
nav:
  logo:
  display_title: true
  fixed: true

# Menu Settings
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# Code Blocks
highlight_theme: mac light
highlight_copy: true
highlight_lang: true
highlight_shrink: false

# Social Links (customize with your own links)
social:
  fas fa-envelope: mailto:your-email@example.com || Email
  fab fa-github: https://github.com/xiaobotester || Github

# Avatar
avatar:
  img: https://avatars.githubusercontent.com/xiaobotester
  effect: false

# Favicon
favicon:

# Image Settings
image_viewer: fancybox

# Post Settings
post_meta:
  page:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true

# Word Count (requires hexo-wordcount plugin)
wordcount:
  enable: false

# TOC (Table of Contents)
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false

# Post Copyright
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Related Posts
related_post:
  enable: true
  limit: 6
  date_type: created

# Footer Settings
footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  copyright: true

# Right Side Settings
rightside:
  readmode: true
  darkmode: true
  hideAside: true

# Lightbox
fancybox: true

# Comments (disabled by default, can enable later)
comments:
  updatetime: false
  use:
  text: true
  lazyload: false
  count: false

# Search
local_search:
  enable: true
  preload: false
  top_n_per_article: 1
  unescape: false
  CDN:

# Analytics (disabled by default)
baidu_analytics:
google_analytics:

# SEO
baidu_push: false

# Beautify
beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#F47466'

# Font Settings
font:
  global-font-size:
  code-font-size:
  font-family:
  code-font-family:

# Theme Color
theme_color:
  enable: true
  main: '#49B1F5'
  paginator: '#00c4b6'
  button_hover: '#FF7242'
  text_selection: '#00c4b6'
  link_color: '#99a9bf'
  meta_color: '#858585'
  hr_color: '#A4D8FA'
  code_foreground: '#F47466'
  code_background: 'rgba(27, 31, 35, .05)'
  toc_color: '#00c4b6'
  blockquote_padding_color: '#49b1f5'
  blockquote_background_color: '#49b1f5'
  scrollbar_color: '#49b1f5'
  meta_time_color: '#858585'

# Display Settings
display:
  index: true
  post: true

# Index Page
index_img:
default_top_img:
archive_img:
tag_img:
category_img:

# Preloader
preloader:
  enable: false
  source_url:

# Anchor
auto_anchor: true

# PWA (disabled by default)
pwa:
  enable: false

# Lazyload
lazyload:
  enable: true
  field: post
  placeholder:
  blur: false

# Background
background:

# Aside Settings
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/xiaobotester
  card_announcement:
    enable: true
    content: 欢迎访问我的博客！
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:

# Inject custom CSS
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
